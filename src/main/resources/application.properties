spring.application.name=statement-mvp
server.port=${SERVER_PORT:8097}

# T24 source, read-only. Credentials come from the environment only.
spring.datasource.url=${T24_JDBC_URL}
spring.datasource.username=${T24_USER}
spring.datasource.password=${T24_PASSWORD}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=${T24_POOL_SIZE:6}
spring.datasource.hikari.pool-name=t24-readonly

# Lead company mnemonic: tables are F<mnemonic>_<APPLICATION>, e.g. FBNK_STMT_ENTRY
statement.default-company=${T24_DEFAULT_COMPANY:BNK}
statement.output-dir=${STATEMENT_OUTPUT_DIR:./output}
statement.bank-name=${STATEMENT_BANK_NAME:Demo Bank}
statement.batch-threads=${STATEMENT_BATCH_THREADS:4}
statement.batch-max-accounts=${STATEMENT_BATCH_MAX:500}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
